name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK üret
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Buildozer ile derle (bulutta)
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          # p4a'yi klonla + BootReceiver yamasini uygula, ardindan derle
          command: bash mobile/ci_prepare.sh && buildozer -v android debug
          workdir: .
          buildozer_version: stable

      - name: APK'yi indirilmeye hazırla
        uses: actions/upload-artifact@v4
        with:
          name: lan-apk
          path: ${{ steps.buildozer.outputs.filename }}
          if-no-files-found: error