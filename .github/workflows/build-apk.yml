name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK üret
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # kivy/buildozer resmi imajindaki sistem paketleriyle ayni set
      - name: Sistem bagimliliklarini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake build-essential ccache cmake gettext \
            libffi-dev libltdl-dev libssl-dev libtool patch pkg-config \
            unzip zip zlib1g-dev

      - name: Buildozer kur
        run: |
          pip install --upgrade pip wheel "cython<3.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: p4a hazirla (BootReceiver yamasi) ve APK derle
        run: |
          set +e
          bash -x mobile/ci_prepare.sh 2>&1 | tee prepare.log
          pstatus=${PIPESTATUS[0]}
          echo "ci_prepare cikis kodu: $pstatus"
          if [ $pstatus -ne 0 ]; then
            echo "::error::ci_prepare basarisiz (kod $pstatus)"
            tail -n 30 prepare.log
            exit $pstatus
          fi
          # NOT: pip 26, android wheel'ini cozumlemede secip kurulumda
          # reddediyor; charset-normalizer'i kaynaktan kurmaya zorluyoruz.
          # (p4a calisani tum env'i pip'e aktarir)
          export PIP_NO_BINARY=charset-normalizer
          buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "buildozer cikis kodu: $status"
          if [ $status -ne 0 ]; then
            echo "::error::buildozer basarisiz (kod $status)"
            {
              echo '--- gradle What went wrong ---'
              grep -a -A 12 'What went wrong' build.log | tail -n 40
              echo '--- error / failure satirlari ---'
              grep -anE 'error:|e: |Execution failed|FAILURE: |Caused by|unexpected|expected|Unparsed|MERGE' build.log | grep -av 'performance hint' | tail -n 40
              echo '--- son 15 satir ---'
              tail -n 15 build.log
            } > err_excerpt.txt
            # ANSI temizle + gradle progress noktalarini sikistir; tek satira duzlestir
            sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r//g' -e 's/[\x00-\x08\x0b\x0c\x0e-\x1f]//g' -e 's/\.\{20,\}/../g' err_excerpt.txt \
              | tr '\n' '|' | cut -c1-3900 > err_flat.txt
            echo "::error::$(cat err_flat.txt)"
            # dist manifest'i ayri annotation'da (parse hatasi teshisi icin)
            mf=.buildozer/android/platform/build-arm64-v8a/dists/lanmobile/src/main/AndroidManifest.xml
            if [ -f "$mf" ]; then
              sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r//g' "$mf" \
                | tr '\n' '~' | cut -c1-3900 > mf_flat.txt
              echo "::error::DISTMANIFEST $(cat mf_flat.txt)"
            else
              echo "::error::DISTMANIFEST bulunamadi: $mf"
            fi
            exit $status
          fi

      - name: Hata gunlugu kaydet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            prepare.log
          if-no-files-found: ignore

      - name: APK'yi indirilmeye hazirla
        uses: actions/upload-artifact@v4
        with:
          name: lan-apk
          path: bin/*.apk
          if-no-files-found: error