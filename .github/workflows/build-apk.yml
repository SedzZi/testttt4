name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK üret
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # kivy/buildozer resmi imajindaki sistem paketleriyle ayni set
      - name: Sistem bagimliliklarini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake build-essential ccache cmake gettext \
            libffi-dev libltdl-dev libssl-dev libtool patch pkg-config \
            unzip zip zlib1g-dev

      - name: Buildozer kur
        run: |
          pip install --upgrade pip wheel "cython<3.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: p4a hazirla (BootReceiver yamasi) ve APK derle
        run: |
          set +e
          bash -x mobile/ci_prepare.sh 2>&1 | tee prepare.log
          pstatus=${PIPESTATUS[0]}
          echo "ci_prepare cikis kodu: $pstatus"
          if [ $pstatus -ne 0 ]; then
            echo "::error::ci_prepare basarisiz (kod $pstatus)"
            tail -n 30 prepare.log
            exit $pstatus
          fi
          buildozer -v android debug 2>&1 | tee build.log
          status=${PIPESTATUS[0]}
          echo "buildozer cikis kodu: $status"
          if [ $status -ne 0 ]; then
            echo "::error::buildozer basarisiz (kod $status)"
            # Hatayi tanimla: Traceback yoksa son 25 satir
            start=$(grep -na 'Traceback (most recent call last)' build.log | tail -n1 | cut -d: -f1 || true)
            if [ -n "$start" ]; then
              tail -n +$start build.log | head -n 40 > err_excerpt.txt
            else
              tail -n 25 build.log > err_excerpt.txt
            fi
            # ANSI kodlarini temizle; satirlari ~2500'lik gruplar hâlinde annotation'a yaz
            sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\r//g' -e 's/[\x00-\x08\x0b\x0c\x0e-\x1f]//g' err_excerpt.txt \
              | awk '{ total += length($0) + 1; buf = buf $0 "\n"; if (total > 2500) { print buf "\n---GRUP SONU---"; buf=""; total=0 } } END { if (buf != "") print buf }' \
              | awk 'BEGIN{RS="---GRUP SONU---"} NF { gsub(/^[[:space:]]+|[[:space:]]+$/, ""); print "::error::" $0 }'
            exit $status
          fi

      - name: Hata gunlugu kaydet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            build.log
            prepare.log
          if-no-files-found: ignore

      - name: APK'yi indirilmeye hazirla
        uses: actions/upload-artifact@v4
        with:
          name: lan-apk
          path: bin/*.apk
          if-no-files-found: error