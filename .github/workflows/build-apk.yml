name: APK Derle

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    name: Android APK üret
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Kodu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: JDK 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # kivy/buildozer resmi imajindaki sistem paketleriyle ayni set
      - name: Sistem bagimliliklarini kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -qq -y --no-install-recommends \
            autoconf automake build-essential ccache cmake gettext \
            libffi-dev libltdl-dev libssl-dev libtool patch pkg-config \
            unzip zip zlib1g-dev

      - name: Buildozer kur
        run: |
          pip install --upgrade pip wheel "cython<3.0"
          pip install git+https://github.com/kivy/buildozer.git@master

      - name: p4a hazirla (BootReceiver yamasi) ve APK derle
        run: |
          bash mobile/ci_prepare.sh
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          status=$?
          if [ $status -ne 0 ]; then
            echo "::error::buildozer cikis kodu $status"
            grep -naE 'error|Error|ERROR|Traceback|FAILURE|Exception|failed' build.log \
              | tail -n 40 | cut -c1-350 | while IFS= read -r line; do
                echo "::error::$line"
              done
            exit $status
          fi

      - name: Hata gunlugu kaydet
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore

      - name: APK'yi indirilmeye hazirla
        uses: actions/upload-artifact@v4
        with:
          name: lan-apk
          path: bin/*.apk
          if-no-files-found: error